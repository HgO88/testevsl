        position: absolute;
        inset: 0;

        white-space: nowrap;
      }

        position: absolute;
        width: 22px;
        height: 34px;
        border-radius: 5px;
      }

      <section id="s-brand" class="clip" data-start="11.53" data-duration="2.66" data-track-index="4" style="position:absolute;inset:0">

        <div class="title-wrap" id="brand">
          <div class="outline"><span class="yl" data-split>Letícia’s</span><span class="yl small" data-split>Bolos</span></div>

    <script>
      // ---- split text into letter spans (static DOM, built before the timeline) ----
      document.querySelectorAll("[data-split]").forEach((el) => {
        const text = el.textContent;
        el.textContent = "";
        for (const c of text) {
          const s = document.createElement("span");
          if (c === " ") {
            s.className = "sp";
            s.innerHTML = "&nbsp;";
          } else {
            s.className = "ch";
            s.textContent = c;
          }
          el.appendChild(s);
        }
      });

      // ---- seeded confetti ----
      let seed = 7;
      const rnd = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
      const colors = ["#ffd400", "#ff3b3b", "#ffffff", "#ff8fb1", "#7a3b12"];
      const layer = document.getElementById("confetti-layer");
      const confetti = [];
      for (let i = 0; i < 46; i++) {
        const d = document.createElement("div");
        d.className = "confetti";
        d.style.background = colors[i % colors.length];
        d.style.left = 40 + rnd() * 1000 + "px";
        d.style.top = "-80px";
        layer.appendChild(d);
        confetti.push({ el: d, fall: 1500 + rnd() * 600, delay: rnd() * 0.9, rot: 360 + rnd() * 540, drift: (rnd() - 0.5) * 220 });
      }

      const B = (k) => 0.09 + 0.3093 * k; // beat grid measured from the original audio
      const tl = gsap.timeline({ paused: true });

      // ---- footage: one continuous forward drift; every shot dissolves into the next ----
      const XF = 0.25; // dissolve length, incoming shot starts this much before the cut
      const shots = [
        ["#f1", 0, 1.33], ["#f2", 1.33, 1.23], ["#f3", 2.56, 1.24], ["#f4", 3.8, 0.93],
        ["#f5", 4.73, 0.93], ["#f6", 5.66, 1.23], ["#f7", 6.89, 0.93], ["#f8", 7.82, 1.86],
        ["#f9", 9.68, 0.93], ["#f10", 10.61, 0.92], ["#f11", 11.53, 2.66],
      ];
      shots.forEach(([id, cut, dur], i) => {
        const t0 = i === 0 ? 0 : cut - XF;
        const t1 = cut + dur;
        // #f4 is already a tight close-up in the source: barely any drift on it (client feedback)
        const [s0, s1] = id === "#f4" ? [1.0, 1.03] : [1.04, 1.12];
        tl.fromTo(id, { scale: s0 }, { scale: s1, duration: t1 - t0, ease: "none" }, t0);
        if (i > 0) {
          tl.fromTo(id, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: XF, ease: "sine.inOut" }, t0);
        }
      });
      // section changes (into the praça, into the close) glide up instead of a plain dissolve
      [["#f6", 5.66], ["#f11", 11.53]].forEach(([id, cut]) => {
        tl.fromTo(id, { y: 140 }, { y: 0, duration: 0.6, ease: "power2.out" }, cut - XF);
      });

      // ---- "É HOJE!" — letters pop one by one (0.10–0.55 as in the original) ----
      tl.fromTo("#hoje .ch", { scale: 0, y: 40, rotation: -14 }, { scale: 1, y: 0, rotation: 0, duration: 0.32, ease: "back.out(2.6)", stagger: 0.075 }, 0.1);
      // beat bumps
      [B(4), B(8)].forEach((t) => {
        tl.fromTo("#hoje", { scale: 1.12 }, { scale: 1, duration: 0.25, ease: "power3.out", immediateRender: false }, t);
      });
      tl.fromTo("#spark-a path", { strokeDasharray: 60, strokeDashoffset: 60 }, { strokeDashoffset: 0, duration: 0.18, stagger: 0.05, ease: "power2.out" }, 0.55);
      tl.fromTo("#spark-a", { scale: 0.6, transformOrigin: "0% 100%" }, { scale: 1, duration: 0.3, ease: "back.out(3)" }, 0.55);

      // date pill lands right after the voice finishes "é hoje" (~1.8s)
      tl.fromTo("#dia", { scale: 0, rotation: 6 }, { scale: 1, rotation: 2, duration: 0.36, ease: "back.out(2.2)" }, 1.8);
      // "Festival de Fatias" — handwritten type-on as the voice starts the next phrase (~2.15s) + arrow draw
      tl.fromTo("#arrow path", { strokeDasharray: 260, strokeDashoffset: 260 }, { strokeDashoffset: 0, duration: 0.28, stagger: 0.12, ease: "power2.inOut" }, 2.0);
      tl.fromTo("#festival .ch", { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: 0.08, stagger: 0.036, ease: "power1.out" }, 2.2);
      tl.fromTo("#spark-b path", { strokeDasharray: 60, strokeDashoffset: 60 }, { strokeDashoffset: 0, duration: 0.18, stagger: 0.05 }, 2.85);

      // exit: the title drifts toward camera and dissolves with the footage
      tl.to("#s-hoje .title-wrap, #dia, #festival, #arrow, #spark-a, #spark-b", { scale: 1.12, autoAlpha: 0, filter: "blur(6px)", duration: 0.3, ease: "sine.in" }, 3.5);

      // ---- "Praça do / Eng do meio" — letters pop (5.70–6.95) ----
      tl.fromTo("#praca .ch", { scale: 0, y: 36, rotation: 10 }, { scale: 1, y: 0, rotation: 0, duration: 0.3, ease: "back.out(2.4)", stagger: 0.062 }, 5.72);
      tl.fromTo("#spark-c path, #spark-d path", { strokeDasharray: 60, strokeDashoffset: 60 }, { strokeDashoffset: 0, duration: 0.18, stagger: 0.05 }, 6.85);
      [B(20), B(23)].forEach((t) => {
        tl.fromTo("#praca", { scale: 1.08 }, { scale: 1, duration: 0.25, ease: "power3.out", immediateRender: false }, t);
      });
      tl.to("#praca", { y: -40, autoAlpha: 0, duration: 0.3, ease: "sine.in" }, 7.62);

      // ---- "Às 14:30h" — pill lands with the voice (~7.95s) and pulses on the beat ----
      tl.fromTo("#pill", { scale: 0, rotation: -8 }, { scale: 1, rotation: -3, duration: 0.36, ease: "back.out(2.2)" }, 7.95);
      for (let k = 27; k <= 33; k++) {
        tl.fromTo("#pill", { scale: 1.09 }, { scale: 1, duration: 0.26, ease: "power2.out", immediateRender: false }, B(k));
      }
      tl.to("#pill", { y: -30, autoAlpha: 0, duration: 0.3, ease: "sine.in" }, 10.31);

      // ---- close: Letícia's Bolos + confetti ----
      tl.fromTo("#brand .ch", { scale: 0, y: -60, rotation: -12 }, { scale: 1, y: 0, rotation: 0, duration: 0.34, ease: "back.out(2.6)", stagger: 0.055 }, 11.62);
      tl.fromTo("#brand-sub span", { y: 140, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.4, ease: "back.out(1.8)" }, 12.45);
      [B(41), B(43), B(45)].forEach((t) => {
        tl.fromTo("#brand", { scale: 1.07 }, { scale: 1, duration: 0.25, ease: "power3.out", immediateRender: false }, t);
      });
      confetti.forEach((c) => {
        tl.fromTo(c.el, { y: 0, x: 0, rotation: 0 }, { y: c.fall, x: c.drift, rotation: c.rot, duration: 1.9, ease: "power1.in" }, 11.62 + c.delay);
      });

      window.__timelines["main"] = tl;
    </script>
